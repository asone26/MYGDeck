name = "gemini"
launch = "gemini"
resume_args = "--resume latest"
mention = "@{path}"
model_cmd = "/model {model}"
models = ["default", "gemini-2.5-pro", "gemini-2.5-flash"]
base_model = "default"
deep_model = "gemini-2.5-pro"
clear_cmd = "/clear"
context_limit = 1000000
status = "idle"
commands = ["/help", "/clear", "/compress", "/model", "/memory", "/stats", "/tools", "/mcp", "/chat", "/quit"]
# Approval prompt text (no hooks): the card shows "waiting" when the output stops on it. Unverified.
waiting = "Waiting for user confirmation|Allow execution"
