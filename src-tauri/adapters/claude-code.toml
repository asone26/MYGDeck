name = "claude-code"
launch = "claude --model opus --effort medium"
# {settings} is replaced with the deck's hook settings file (status badges, spec 5.3).
hook_args = "--settings {settings}"
# Reopens the project's last conversation when the deck starts after a reboot.
resume_args = "--continue"
mention = "@{path}"
model_cmd = "/model {model}"
models = ["default", "opus", "sonnet", "haiku"]
effort_cmd = "/effort {effort}"
efforts = ["low", "medium", "high", "xhigh", "max"]
clear_cmd = "/clear"
context_limit = 200000
status = "hooks"
commands = [
  "/help", "/clear", "/compact", "/context", "/cost", "/model", "/effort", "/review", "/init",
  "/memory", "/config", "/permissions", "/agents", "/mcp", "/resume", "/rewind",
  "/status", "/doctor", "/exit",
]
# Model the router switches to for design / hard-debugging inputs, and the one it returns to (spec 4.3).
deep_model = "opus"
base_model = "opus"
