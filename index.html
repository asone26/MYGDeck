<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MYG Deck</title>
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <div id="aura" aria-hidden="true">
      <canvas id="cosmos"></canvas>
    </div>
    <header id="strip">
      <div id="chips"></div>
      <button id="add-btn" title="프로젝트 추가 (Ctrl+')" aria-label="프로젝트 추가">+</button>
      <button id="keys-btn" title="단축키 보기" aria-label="단축키 보기"></button>
      <button id="theme-btn" aria-label="테마 바꾸기"></button>
      <button id="conn-btn" title="AI 연결 · API 키 관리" aria-label="AI 연결">🔑</button>
    </header>
    <main id="deck"><div id="grid"></div><div id="side"></div></main>
    <div id="empty" hidden>
      <h1>여러 프로젝트를 한 창에서 동시에</h1>
      <p>프로젝트마다 에이전트 CLI가 따로 돌고, 손이 필요한 곳만 빛납니다.</p>
      <button class="add-first" id="add-first">프로젝트 폴더 추가 <kbd>Ctrl+'</kbd></button>
      <div id="empty-extra" class="empty-extra"></div>
      <p class="note">추가한 프로젝트는 mygdeck.json에 저장되어 다음 실행 때 그대로 열립니다.</p>
    </div>
    <div id="overlay" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
