<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MYGDeck</title>
  </head>
  <body>
    <header id="strip">
      <div id="chips"></div>
      <button id="add-btn" title="프로젝트 추가 (Alt+N)">+</button>
      <span class="keys">Alt+J 다음 대기 · Alt+O 전체 · Alt+1~9 이동 · Ctrl+P 파일</span>
      <button id="conn-btn" title="AI 연결 · API 키 관리">🔑</button>
    </header>
    <main id="deck"><div id="grid"></div><div id="side"></div></main>
    <div id="empty" hidden>
      <p>여러 프로젝트를 한 창에서 동시에.</p>
      <p class="muted">추가한 프로젝트는 mygdeck.json에 저장되어 다음 실행 때 그대로 열립니다.</p>
    </div>
    <div id="overlay" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
