<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#0a0c10" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="MYG Deck" />
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
  <link rel="icon" href="/icon.png" />
  <link rel="apple-touch-icon" href="/icon.png" />
  <title>MYG Deck</title>
  <link rel="stylesheet" href="/app.css" />
  <script src="/xterm.js"></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <!-- Daily password (Cloudflare Pages relay) -->
  <section id="login-view" class="view login" hidden>
    <form id="login-form" class="login-box" autocomplete="on">
      <h1 class="brand">MYG Deck</h1>
      <p class="login-sub">PC의 에이전트를 보려면 비밀번호를 입력하세요. 하루 동안 다시 묻지 않습니다.</p>
      <input type="text" name="username" value="mygdeck" autocomplete="username" hidden />
      <label for="password" class="login-label">비밀번호</label>
      <input id="password" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required />
      <p id="login-error" class="login-error" role="alert" hidden></p>
      <button id="login-btn" class="primary" type="submit">열기</button>
    </form>
  </section>

  <!-- Project list -->
  <section id="list-view" class="view">
    <header class="bar">
      <h1 class="brand">MYG Deck</h1>
      <p id="summary" class="summary"></p>
      <button id="theme-btn" class="icon-btn" type="button" aria-label="테마 전환" title="테마 전환 (시스템 · 밝게 · 어둡게)">◐</button>
      <button id="push" class="icon-btn push-btn" type="button" aria-pressed="false" aria-label="알림 켜기" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path class="slash" d="M4 4l16 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </header>
    <!-- Moved under the visible view's top bar by app.js (placeBanner). -->
    <div id="banner" class="banner" role="status" hidden></div>
    <ul id="projects" class="projects"></ul>
    <div id="empty" class="empty" hidden>
      <p class="empty-title">실행 중인 에이전트가 없습니다</p>
      <p>아래 <b>프로젝트 추가</b>로 PC의 폴더를 골라 바로 시작할 수 있습니다.</p>
    </div>
    <footer class="list-foot">
      <button id="add-open" class="ghost wide" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        프로젝트 추가
      </button>
    </footer>
  </section>

  <!-- Add a project: browse folders on the PC -->
  <section id="add-view" class="view" hidden>
    <header class="bar detail-bar">
      <button id="add-back" class="icon-btn" aria-label="프로젝트 목록">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="d-title plain">
        <h1>프로젝트 추가</h1>
        <p id="add-path" class="d-status"></p>
      </div>
    </header>
    <div id="add-search" class="add-search" hidden>
      <input id="add-filter" type="search" placeholder="이 폴더에서 찾기" aria-label="폴더 이름으로 찾기" autocomplete="off" autocapitalize="off" spellcheck="false" />
    </div>
    <ul id="dirs" class="dirs"></ul>
    <footer id="add-foot" class="composer add-foot" hidden>
      <button id="add-here" class="primary wide" type="button">이 폴더로 시작</button>
    </footer>
  </section>

  <!-- One project -->
  <section id="detail-view" class="view" hidden>
    <header class="bar detail-bar">
      <button id="back" class="icon-btn" aria-label="프로젝트 목록">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="d-title">
        <h1 id="d-name"></h1>
        <p id="d-status" class="d-status"></p>
      </div>
    </header>

    <div id="ask" class="ask" hidden>
      <p class="ask-label">응답이 필요합니다</p>
      <p id="ask-head" class="ask-head"></p>
      <p id="ask-q" class="ask-q"></p>
      <div id="ask-choices" class="ask-choices"></div>
    </div>

    <div class="tabs">
      <div role="tablist" class="tablist">
        <button id="tab-turn" role="tab" aria-selected="true" aria-controls="turn">답변</button>
        <button id="tab-cli" role="tab" aria-selected="false" aria-controls="cli">CLI 화면</button>
        <button id="tab-diff" role="tab" aria-selected="false" aria-controls="m-diff">변경</button>
      </div>
      <div id="cli-tools" class="cli-tools" hidden>
        <button id="cli-wrap" type="button" aria-pressed="false">줄바꿈</button>
        <button id="cli-smaller" type="button" aria-label="글자 작게">가−</button>
        <button id="cli-bigger" type="button" aria-label="글자 크게">가+</button>
      </div>
    </div>

    <main id="d-body" class="d-body">
      <div id="turn" class="turn" role="tabpanel" aria-labelledby="tab-turn"></div>
      <pre id="cli" class="cli" role="tabpanel" aria-labelledby="tab-cli" tabindex="0" hidden></pre>
      <div id="m-diff" class="m-diff" role="tabpanel" aria-labelledby="tab-diff" hidden></div>
    </main>

    <footer class="composer">
      <p id="hint" class="composer-hint" hidden>위 선택지에 먼저 답하세요</p>
      <textarea id="input" rows="1" placeholder="에이전트에게 지시" enterkeyhint="enter" autocomplete="off"></textarea>
      <div class="composer-actions">
        <button id="stop" class="ghost" type="button" hidden>중지</button>
        <button id="send" class="primary" type="button">보내기</button>
      </div>
    </footer>
  </section>

  <div id="toast" class="toast" role="alert" hidden></div>
</body>
</html>
