name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build Windows installer & portable zip
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          npx tauri build
          cargo build --release --manifest-path src-tauri/Cargo.toml --bin mygdeck-cli
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release-assets/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi release-assets/
          Compress-Archive -Path src-tauri/target/release/mygdeck.exe, src-tauri/target/release/mygdeck-cli.exe -DestinationPath release-assets/mygdeck-windows-x64.zip -Force

      - name: Build macOS Universal dmg & CLI
        if: matrix.platform == 'macos'
        run: |
          npx tauri build --target universal-apple-darwin
          cargo build --release --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin --bin mygdeck-cli
          cargo build --release --manifest-path src-tauri/Cargo.toml --target x86_64-apple-darwin --bin mygdeck-cli
          mkdir -p release-assets
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg release-assets/
          lipo -create -output release-assets/mygdeck-cli \
            src-tauri/target/aarch64-apple-darwin/release/mygdeck-cli \
            src-tauri/target/x86_64-apple-darwin/release/mygdeck-cli
          tar -czf release-assets/mygdeck-cli-macos-universal.tar.gz -C release-assets mygdeck-cli
          rm release-assets/mygdeck-cli

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release-assets/*

      - name: Upload workflow artifacts (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: mygdeck-${{ matrix.platform }}
          path: release-assets/*
